<!-- Peak & Panes badge, redrawn as vector from the supplied artwork: navy
     disc inside a gold ring, roof + four-pane window, squeegee left, brush
     right, wordmark on the ribbon, tagline below.
     This is a recreation, not the original file. To use the real artwork,
     drop it in beside this as logo.png and point header.js at it — nothing
     else in the app references the mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240">
  <defs>
    <style>
      .wm { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 900; }
      .tag { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
             font-weight: 700; letter-spacing: 7px; }
    </style>
  </defs>

  <!-- Rings: navy edge, white gap, gold, white gap, navy field -->
  <circle cx="620" cy="612" r="592" fill="#ffffff" stroke="#1a3c66" stroke-width="14"/>
  <circle cx="620" cy="612" r="548" fill="none" stroke="#f2a71b" stroke-width="20"/>
  <circle cx="620" cy="612" r="512" fill="#1a3c66"/>

  <!-- House: chimney first so the roof line crosses in front of it -->
  <rect x="772" y="252" width="54" height="108" fill="#ffffff"/>
  <path d="M352 376 628 190 904 376" fill="none" stroke="#ffffff" stroke-width="38"
        stroke-linejoin="miter" stroke-linecap="square"/>

  <!-- Four-pane window -->
  <rect x="546" y="374" width="76" height="82" fill="#ffffff"/>
  <rect x="638" y="374" width="76" height="82" fill="#ffffff"/>
  <rect x="546" y="472" width="76" height="82" fill="#ffffff"/>
  <rect x="638" y="472" width="76" height="82" fill="#ffffff"/>

  <!-- Squeegee -->
  <g transform="rotate(-11 350 445)">
    <rect x="196" y="414" width="312" height="56" rx="16" fill="#ffffff"
          stroke="#1a3c66" stroke-width="9"/>
    <rect x="222" y="436" width="258" height="9" fill="#1a3c66"/>
    <rect x="326" y="468" width="48" height="66" fill="#ffffff" stroke="#1a3c66" stroke-width="9"/>
    <rect x="316" y="524" width="68" height="118" rx="22" fill="#ffffff"
          stroke="#1a3c66" stroke-width="9"/>
  </g>
  <path d="M262 486 306 470 296 522 254 534z" fill="#ffffff" stroke="#1a3c66" stroke-width="7"/>

  <!-- Paint brush -->
  <g transform="rotate(21 930 450)">
    <rect x="866" y="336" width="152" height="96" rx="7" fill="#f2a71b"
          stroke="#1a3c66" stroke-width="9"/>
    <path d="M898 340v88M930 340v88M962 340v88M994 340v88" stroke="#1a3c66" stroke-width="7"/>
    <rect x="854" y="428" width="176" height="52" rx="6" fill="#ffffff"
          stroke="#1a3c66" stroke-width="9"/>
    <path d="M854 448h176M854 466h176" stroke="#1a3c66" stroke-width="8"/>
    <path d="M886 480h112l-18 158a38 38 0 0 1-76 0z" fill="#ffffff"
          stroke="#1a3c66" stroke-width="9"/>
    <circle cx="942" cy="612" r="11" fill="#1a3c66"/>
  </g>

  <!-- Ribbon -->
  <rect x="18" y="588" width="1204" height="276" rx="16" fill="#1a3c66"
        stroke="#ffffff" stroke-width="12"/>
  <rect x="46" y="616" width="1148" height="220" rx="8" fill="none"
        stroke="#ffffff" stroke-width="10"/>
  <text class="wm" x="620" y="790" text-anchor="middle" font-size="152"
        textLength="1058" lengthAdjust="spacingAndGlyphs" fill="#ffffff">PEAK <tspan fill="#f2a71b">&amp;</tspan> PANES</text>

  <!-- Tagline -->
  <path d="M292 942h74M874 942h74" stroke="#f2a71b" stroke-width="12" stroke-linecap="round"/>
  <text class="tag" x="620" y="962" text-anchor="middle" font-size="62"
        textLength="486" lengthAdjust="spacingAndGlyphs" fill="#ffffff">CLEAR VIEWS.</text>
  <text class="tag" x="620" y="1046" text-anchor="middle" font-size="62"
        textLength="560" lengthAdjust="spacingAndGlyphs" fill="#ffffff">TRUSTED CARE.</text>
</svg>
