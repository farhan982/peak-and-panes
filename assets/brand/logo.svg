<!-- Placeholder recreation of the Peak & Panes shield. Swap this file for the
     real logo artwork and every screen picks it up — nothing else references
     the mark. Keep the same viewBox proportions (roughly 5:6).
     Each white element sits on a slightly larger navy shape so the pane and
     squeegee stay legible where they cross the white mountains. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 118" width="100" height="118">
  <defs>
    <clipPath id="shield">
      <path d="M50 6 94 19.5v41C94 89 73 104.5 50 112 27 104.5 6 89 6 60.5v-41z"/>
    </clipPath>
  </defs>

  <path d="M50 6 94 19.5v41C94 89 73 104.5 50 112 27 104.5 6 89 6 60.5v-41z"
        fill="#0b2242" stroke="#c8971d" stroke-width="5.5" stroke-linejoin="round"/>

  <g clip-path="url(#shield)">
    <!-- Mountain range -->
    <path d="M6 66 30 33l13 16 13-17 32 34v10H6z" fill="#ffffff"/>
    <path d="M30 33l13 16-5 6-13-16zM56 32l12 13-6 7-11-13z" fill="#c2d2e4"/>
    <path d="M30 33l5.5 6.8L30 42.5l-5.5-2.7zM56 32l5 6.2-5 2.4-5-2.4z" fill="#f5f9ff"/>

    <!-- Squeegee: navy relief first, then the white handle and blade -->
    <rect x="43.5" y="72" width="13" height="24" fill="#0b2242"/>
    <rect x="27" y="89" width="46" height="13" rx="6.5" fill="#0b2242"/>
    <rect x="46.5" y="74" width="7" height="19" fill="#ffffff"/>
    <rect x="29.5" y="91.5" width="41" height="8" rx="4" fill="#ffffff"/>

    <!-- Window pane, lifted off the mountains by a navy border -->
    <rect x="33" y="48" width="34" height="30" rx="4" fill="#0b2242"/>
    <rect x="36.2" y="51.2" width="27.6" height="23.6" rx="1.6" fill="#ffffff"/>
    <rect x="48.5" y="51.2" width="3" height="23.6" fill="#0b2242"/>
    <rect x="36.2" y="61.5" width="27.6" height="3" fill="#0b2242"/>
  </g>
</svg>
